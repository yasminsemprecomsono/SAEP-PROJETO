<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-primary d-flex align-items-center justify-content-center vh-100">

<div class="card p-4 shadow" style="width: 360px;">
    <h3 class="text-center mb-1">Bem-vindo</h3>
    <p class="text-center text-muted mb-3">Entre com seus dados</p>

    <!-- Exibe mensagens de erro (campos vazios ou credenciais inválidas) -->
    <div th:if="${erro != null}" class="alert alert-danger py-2" th:text="${erro}"></div>

    <!-- Requisito 1: Campos visíveis e funcionais -->
    <form th:action="@{/login}" th:object="${usuarioDto}" method="post">
        <div class="mb-3">
            <label class="form-label">Login</label>
            <input type="text" class="form-control" th:field="*{login}" placeholder="Digite seu login">
        </div>
        <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" class="form-control" th:field="*{senha}" placeholder="Digite sua senha">
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar</button>
    </form>
</div>

</body>
</html>
