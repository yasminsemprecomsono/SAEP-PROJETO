<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Tela Principal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navegação superior -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4">
  <span class="navbar-brand fw-bold">Sistema SAEP</span>
  <div class="ms-auto d-flex align-items-center gap-3">
    <!-- Atende Requisito 2: Nome do usuário logado -->
    <span class="text-white">Usuário: <strong th:text="${usuario.login}">Nome</strong></span>
    <!-- Atende Requisito 5: Logout -->
    <a href="/logout" class="btn btn-outline-light btn-sm">Sair</a>
  </div>
</nav>

<div class="container my-5">
  <h2 class="mb-4">Painel Principal</h2>

  <div class="row g-4">
    <!-- Atende Requisito 3: Acesso claro para Cadastro de Produto -->
    <div class="col-md-6">
      <div class="card p-4 shadow-sm border-0">
        <h4 class="card-title">Cadastro de Produto</h4>
        <p class="text-muted">Cadastre novos itens e produtos no sistema.</p>
        <a href="/cadastro-produto" class="btn btn-primary w-100">Acessar Cadastro de Produto</a>
      </div>
    </div>

    <!-- Atende Requisito 4: Acesso claro para Gestão de Estoque -->
    <div class="col-md-6">
      <div class="card p-4 shadow-sm border-0">
        <h4 class="card-title">Gestão de Estoque</h4>
        <p class="text-muted">Controle o fluxo, entradas e saídas do estoque.</p>
        <a href="/gestao-estoque" class="btn btn-success w-100">Acessar Gestão de Estoque</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
