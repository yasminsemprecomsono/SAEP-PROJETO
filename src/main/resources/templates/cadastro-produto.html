<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
        <span class="navbar-brand fw-bold">Sistema SAEP</span>
        <a href="/home" class="btn btn-outline-light btn-sm">Voltar ao Painel</a>
    </div>
</nav>

<div class="container pb-5">
    <div th:if="${erro != null}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white pt-3 border-0">
                    <h5 class="fw-bold mb-0" th:text="${produto.id != null} ? 'Editar Produto' : 'Novo Produto'"></h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Nome do Produto</label>
                            <input type="text" class="form-control" th:field="*{nome}" placeholder="Ex: Teclado USB">
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Preço (R$)</label>
                            <input type="number" step="0.01" min="0" class="form-control" th:field="*{preco}" placeholder="0.00">
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Quantidade</label>
                            <input type="number" min="0" class="form-control" th:field="*{quantidade}" placeholder="0">
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary fw-bold">Salvar Produto</button>
                            <a th:if="${produto.id != null}" href="/cadastro-produto" class="btn btn-light border">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-4">
                    <form method="get" action="/cadastro-produto" class="row g-2 mb-4">
                        <div class="col-sm-9">
                            <input type="text" name="busca" class="form-control" placeholder="Buscar produto por nome..." th:value="${busca}">
                        </div>
                        <div class="col-sm-3">
                            <button type="submit" class="btn btn-primary w-100">Buscar</button>
                        </div>
                    </form>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Preço</th>
                                <th>Qtd.</th>
                                <th class="text-end">Ações</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p : ${produtos}">
                                <td th:text="${p.id}" class="fw-bold text-muted"></td>
                                <td th:text="${p.nome}" class="fw-semibold"></td>
                                <td th:text="${'R$ ' + p.preco}"></td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${p.quantidade}"></span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/produtos/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-warning me-1">Editar</a>

                                    <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" th:data-bs-target="${'#modalDeletar' + p.id}">
                                        Excluir
                                    </button>

                                    <div class="modal fade text-start" th:id="${'modalDeletar' + p.id}" tabindex="-1" aria-hidden="true">
                                        <div class="modal-dialog modal-dialog-centered">
                                            <div class="modal-content">
                                                <div class="modal-header">
                                                    <h5 class="modal-title fs-6 fw-bold">Confirmar Exclusão</h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                </div>
                                                <div class="modal-body">
                                                    Deseja realmente excluir o produto <strong th:text="${p.nome}"></strong>?
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                                                    <a th:href="@{/produtos/deletar/{id}(id=${p.id})}" class="btn btn-danger btn-sm">Excluir</a>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(produtos)}">
                                <td colspan="5" class="text-center text-muted py-4">Nenhum produto encontrado.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
